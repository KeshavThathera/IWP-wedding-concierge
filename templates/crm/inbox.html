{% extends "crm/base_staff.html" %}

{% block embed_content %}{% include "crm/_inbox_panel.html" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-[1480px]">
  <div class="mb-8 flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
    <div>
      <p class="eyebrow text-gold">Team inbox</p>
      <h1 class="mt-3 font-serif text-[40px] font-light leading-tight text-ink">One inbox, every enquiry.</h1>
      <p class="mt-1 text-[14px] text-charcoal/60">Review context, take ownership and keep each handoff moving.</p>
    </div>
    <form method="get" action="{% url 'crm:inbox' %}" class="flex gap-2" hx-get="{% url 'crm:inbox' %}" hx-trigger="change" hx-target="#inbox-panel" hx-swap="outerHTML" hx-push-url="true">
      <select name="department" aria-label="Filter by department" class="rounded-md border border-hairline bg-paper px-3 py-2.5 text-[13px] text-ink outline-none focus:border-gold">
        <option value="">All departments</option>
        {% for d in departments %}<option value="{{ d }}" {% if d == department %}selected{% endif %}>{{ d }}</option>{% endfor %}
      </select>
      <select name="status" aria-label="Filter by status" class="rounded-md border border-hairline bg-paper px-3 py-2.5 text-[13px] text-ink outline-none focus:border-gold">
        <option value="">All statuses</option>
        {% for value, label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
      <noscript><button class="btn-outline py-2.5">Filter</button></noscript>
    </form>
  </div>
  {% include "crm/_inbox_panel.html" %}
</div>
{% endblock %}
